
name: marketer_system
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  sqflite: ^2.4.2
  path: ^1.9.1
  pdf: ^3.11.3
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Cairo-VariableFont_slnt,wght.ttf
    - assets/images/app_icon.png

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_slnt,wght.ttf
          weight: 400
        - asset: assets/fonts/Cairo-VariableFont_slnt,wght.ttf
          weight: 700

# إعدادات أيقونة التطبيق
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#F5F7FB"
  adaptive_icon_foreground: "assets/images/app_icon.png"

# إعدادات شاشة البداية
flutter_native_splash:
  color: "#F5F7FB"
  image: "assets/images/app_icon.png"
  android: true
  ios: false
  android_12:
    color: "#F5F7FB"
    image: "assets/images/app_icon.png"
